<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Zelix CLI command overview</title><desc id="desc">Terminal illustration showing zelix help and update, mirrors, clean, info, and language commands.</desc>
<rect width="1000" height="420" rx="26" fill="#101522"/><rect x="26" y="26" width="948" height="368" rx="18" fill="#171f30" stroke="#394862" stroke-width="2"/>
<circle cx="58" cy="58" r="9" fill="#ff6b6b"/><circle cx="88" cy="58" r="9" fill="#ffd166"/><circle cx="118" cy="58" r="9" fill="#06d6a0"/><text x="155" y="66" fill="#b7c4dc" font-family="sans-serif" font-size="20">ZelixOS Terminal</text>
<text x="64" y="132" fill="#78e6c2" font-family="monospace" font-size="25">$ zelix help</text>
<text x="64" y="184" fill="#f2f5fb" font-family="monospace" font-size="22">update   mirrors   clean   flathub</text>
<text x="64" y="222" fill="#f2f5fb" font-family="monospace" font-size="22">info     hello     lang</text>
<path d="M64 252h872" stroke="#394862" stroke-width="2"/>
<text x="64" y="300" fill="#8ea4c8" font-family="monospace" font-size="18">$ zelix lang es</text><text x="64" y="341" fill="#78e6c2" font-family="sans-serif" font-size="20">English  ·  Türkçe  ·  Español</text>
<text x="64" y="373" fill="#8492aa" font-family="sans-serif" font-size="15">Illustrative command overview · see README for the full command list</text></svg>
